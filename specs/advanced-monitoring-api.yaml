tags:
  - name: Per Destination
    description: 'Site-level power and energy aggregates broken down by destination (self-consumption, storage, grid export) and source (PV, storage, grid import).'
  - name: Live Power Flow
    description: 'Start a live telemetry session for a site and read its real-time power-flow samples. Use POST to activate a session, then poll GET to receive high-frequency data while the session is active.'
  - name: Weather Guard
    description: Read whether Weather Guard storm mode is currently enabled for a site. Updating the configuration is handled by the Fleet Management API (forthcoming).
  - name: Battery Backup Reserve
    description: Read the site's battery backup reserve configuration (the minimum state of charge to retain for backup). Updating the configuration is handled by the Fleet Management API (forthcoming).
components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      description: Use the User API Key provided by your account manager
      name: X-API-Key
      in: header
    OAuth:
      type: oauth2
      description: Authorize using an approved OAuth 2.0 token. Use this option to access System Owner data.
      flows:
        authorizationCode:
          refreshUrl: 'https://monitoringapi.solaredge.com/v2/oauth2/token'
          authorizationUrl: 'https://connect.solaredge.com/authorize'
          scopes:
            SITE_DATA: Read aggregated site level data
            DEVICE_DATA: Read specific device data
          tokenUrl: 'https://monitoringapi.solaredge.com/v2/oauth2/token'
  schemas:
    PowerPerDestination:
      type: object
      properties:
        siteId:
          type: integer
          format: int64
        production:
          $ref: '#/components/schemas/SiteProductionPower'
        consumption:
          $ref: '#/components/schemas/SiteConsumptionPower'
    SiteProductionPower:
      type: object
      properties:
        unit:
          type: string
          enum:
            - W
            - KW
            - MW
            - GW
        values:
          type: array
          items:
            $ref: '#/components/schemas/SiteProductionValue'
    SiteProductionValue:
      type: object
      properties:
        timestamp:
          type: string
          format: offset-date-time
        total:
          type: number
          format: float
        toSelfConsumption:
          type: number
          format: float
        toStorage:
          type: number
          format: float
        toGrid:
          type: number
          format: float
    SiteConsumptionPower:
      type: object
      properties:
        unit:
          type: string
          enum:
            - W
            - KW
            - MW
            - GW
        values:
          type: array
          items:
            $ref: '#/components/schemas/SiteConsumptionValue'
    SiteConsumptionValue:
      type: object
      properties:
        timestamp:
          type: string
          format: offset-date-time
        total:

            Each API call consumes a number of credits as documented per operation (currently `1` for every operation). When the credit budget is exhausted or CPM is exceeded, subsequent calls return `429` until the limit resets (monthly credits reset on the account's billing-cycle anniversary date; CPM resets within the minute).


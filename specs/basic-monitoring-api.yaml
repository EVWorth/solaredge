  '/sites/{id}/meters/{serialNumbers}/lifetime-energy':
    get:
      tags:
        - Meter Measurements
      summary: Meter Lifetime Energy
      description: |-
        Returns the lifetime energy for specific meters on a site, read from each meter's onboard cumulative energy counter rather than summed from interval telemetry, sampled every 15 minutes (`resolution=QUARTER_HOUR`) across the requested period. Multiple serial numbers can be specified as a comma-separated path parameter. Each returned value is the counter's actual reading at that timestamp, not a delta, so unlike `/production-energy`, `/consumption-energy`, `/import-energy` and `/export-energy` at `resolution=TOTAL` these values are not affected by gaps in reporting history.

        A meter can measure more than one direction - a bidirectional grid meter reports both an import and an export series - so each entry carries a separate list per direction the meter actually measures. Directions it does not measure come back as empty lists.

        **Which value you get for each quarter hour:** each value is the first counter reading received within that 15-minute window. Devices send telemetry every 5 minutes, at a fixed offset for each device but at an arbitrary point in time, so the first reading of a window always arrives in the first 5 minutes of that window. For example, for the 00:15 to 00:30 window the value is the reading received between 00:15 and 00:20, and for the 00:30 to 00:45 window it is the reading received between 00:30 and 00:35.

        `from` must be before `to`, and the requested window must not exceed 12 hours. `QUARTER_HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at this resolution are rejected.
      operationId: getMeterLifetimeEnergy
      parameters:
        - name: from
          in: query
          description: The start of the requested period.
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-01-01T00:00:00Z'
        - name: to
          in: query
          description: The end of the requested period.
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-01-01T00:30:00Z'
        - name: meters
          in: query

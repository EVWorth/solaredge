                type: integer
              description: Monthly call limit for the key. Sent instead of the per-minute headers for keys with a monthly limit.
            x-ratelimit-remaining-month:
              schema:
                type: integer
              description: Calls left this month. `0` means the key is blocked until the monthly reset.

            Serial numbers that are batteries on the site are always returned, so a request naming a mix of known and unknown/non-battery serials still succeeds with `200` and the rest are simply absent from the response. Comparing the serial numbers you asked for against the ones that came back tells you which were dropped. This `404` is returned only when not one of them resolves.

              schema:
                type: integer
              description: 'Per-second call limit for the key, sent with the monthly headers.'
            x-ratelimit-remaining-second:
              schema:
                type: integer
              description: Calls left in the current second.
            retry-after:
              schema:
                type: integer
              description: Seconds until the caller may retry. Present when the limit has been exceeded. For an exhausted monthly limit this can be weeks.
      security:
        - X-API-Key: []
        - OAuth: []
      servers:
        - url: 'https://monitoringapi.solaredge.com/v2'
          description: Production
      x-credit-cost: 1
tags:
  - name: Sites
    description: 'Endpoints for listing sites and reading site-level configuration, performance, energy, lifetime energy and environmental data.'
  - name: Alerts
    description: Endpoints for retrieving fleet-wide and site-level equipment and performance alerts.
  - name: Inventory
    description: 'Endpoints for discovering the hardware installed at a site (inverters, meters, batteries, optimizers, gateways, sensors).'
  - name: Inverter Telemetry
    description: Bulk per-inverter telemetry - one request returns multiple metrics per inverter at the inverter's sampling resolution. Prefer this over per-metric inverter endpoints when you need several metrics at once.
  - name: Meter Telemetry
    description: Bulk per-meter telemetry - one request returns multiple metrics per meter at the meter's sampling resolution. Prefer this over per-metric meter endpoints when you need several metrics at once.
  - name: Storage Telemetry
    description: Bulk per-battery telemetry - one request returns multiple metrics per battery at the battery's sampling resolution. Prefer this over per-metric battery endpoints when you need several metrics at once.
  - name: EV Charger Telemetry
    description: Bulk per-charger telemetry - one request returns charging power and charging energy for each EV charger on the site.
  - name: Sensor Telemetry
    description: 'Environmental sensor telemetry (irradiance, temperature, wind) for sensors connected to a commercial gateway or an Edge Hub.'
  - name: Inverter Status
    description: 'Per-inverter device status (power limit, operation mode, inverter mode, temperature). Each sample is the last known value in its time bucket, not an average or sum.'
  - name: Storage Status
    description: 'Per-battery device status (state code, internal temperature). Each sample is the last known value in its time bucket, not an average or sum.'
  - name: Inverter Measurements
    description: 'Per-inverter, single-metric time series (AC/DC power, energy, lifetime energy, voltage, current, frequency). Use these when you only need one metric or want a fine-grained resolution per metric.'
  - name: Meter Measurements
    description: 'Per-meter, single-metric time series (production, consumption, import, export power and energy, plus lifetime energy counters).'
  - name: Battery Measurements
    description: 'Per-battery, single-metric time series (charge/discharge power and energy, state of energy, remaining energy, plus lifetime energy counters).'
components:
  securitySchemes:
    X-API-Key:
      type: apiKey
      description: Use the User API Key provided by your account manager
      name: X-API-Key
      in: header
    OAuth:
      type: oauth2
      description: Authorize using an approved OAuth 2.0 token. Use this option to access System Owner data.
      flows:
        authorizationCode:
          refreshUrl: 'https://monitoringapi.solaredge.com/v2/oauth2/token'
          authorizationUrl: 'https://connect.solaredge.com/authorize'
          scopes:
            SITE_DATA: Read aggregated site level data
            DEVICE_DATA: Read specific device data
          tokenUrl: 'https://monitoringapi.solaredge.com/v2/oauth2/token'
  schemas:
    SiteListResponse:
      type: object
      properties:
        sites:
          $ref: '#/components/schemas/SiteListData'
    SiteListData:
      type: object
      properties:
        count:
          type: integer
          description: Total number of sites matching the filters
          format: int32
        site:
          type: array
          items:
            $ref: '#/components/schemas/SiteMetadata'
    SiteMetadata:
      type: object
      description: Information about a single SolarEdge Monitoring site.
      properties:
        siteId:
          type: integer
          format: int64
        name:
          type: string
        peakPower:
          type: number
          description: Installed PV peak power in kWp.
          format: float
        installationDate:
          type: string
          format: offset-date-time
          example: '2026-03-10T00:00:00Z'
        location:
          $ref: '#/components/schemas/Location'
        activationStatus:
          type: string
          description: '"ACTIVE" indicates that the inverter has communicated with the Monitoring Platform at least once. "PENDING" indicates it has never communicated.'
        note:
          type: string
      example:
        siteId: 93082
        name: 'Smith, John CRM1234'
        peakPower: 6.14
        installationDate: '2026-03-10'
        location:
          address: 2888 Main St
          city: Green Bay
          state: Wisconsin
          zip: '54311'
          country: United States
        activationStatus: ACTIVE
        note: 'Created via API, triggered from CRM'
    Location:
      type: object
      description: Information about a location
      properties:
        address:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
          nullable: true
        country:
          type: string
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          nullable: true
          format: URI
        title:
          type: string
        status:
          type: integer
          description: The HTTP status code for this occurrence of the problem.
        detail:
          type: string
        instance:
          type: string
          nullable: true
          format: URI
        traceId:
          type: string
        errors:
          type: object
          description: Field-level validation errors keyed by parameter name.
          additionalProperties:
            type: string
        properties:
          type: object
          additionalProperties:
            type: object
    GatewayError:
      type: object
      description: Error body returned by the API gateway for authentication failures (`401`) and rate or quota limits (`429`). A wrong key or a limit returns `message` and `request_id`; a missing key or token returns `error` and `error_description`. Other errors use `ProblemDetail`.
      properties:
        message:
          type: string
          description: 'Short reason, for example `Unauthorized` or `API rate limit exceeded`.'
          example: API rate limit exceeded
        request_id:
          type: string
          description: Gateway request identifier. Quote it when reporting a problem.
          example: a214540d37085042a568820b95b1357f
        error:
          type: string
          description: 'Error code, sent instead of `message` when the `X-API-Key` header or access token is missing, for example `invalid_request`.'
          example: invalid_request
        error_description:
          type: string
          description: 'Readable reason, sent with `error`, for example `The access token is missing`.'
          example: The access token is missing
    SiteMetadataExtended:
      type: object
      description: Information about a single SolarEdge Monitoring site.
      properties:
        siteId:
          type: integer
          format: int64
        name:
          type: string
        accountId:
          type: integer
          description: The account ID that owns the site.
          format: int32
        peakPower:
          type: number
          description: Installed PV peak power in kWp.
          format: float
        installationDate:
          type: string
          format: offset-date-time
          example: '2026-03-10T00:00:00Z'
        lastUpdateTime:
          type: string
          description: The last time the site received a communication from the inverter.
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        location:
          $ref: '#/components/schemas/LocationExtended'
        activationStatus:
          type: string
          description: '"ACTIVE" indicates that the inverter has communicated with the Monitoring Platform at least once. "PENDING" indicates it has never communicated.'
        note:
          type: string
        cellularPlanExpirationDate:
          type: string
        ptoDate:
          type: integer
          description: The permission to operate date (epoch millis).
          format: int64
      example:
        siteId: 93082
        name: 'Smith, John CRM1234'
        accountId: 123456
        peakPower: 6.14
        installationDate: '2026-03-10'
        lastUpdateTime: '2026-10-08T09:30:00+03:00'
        location:
          address: 2888 Main St
          city: Green Bay
          state: Wisconsin
          zip: '54311'
          country: United States
        activationStatus: ACTIVE
        note: 'Created via API, triggered from CRM'
    LocationExtended:
      type: object
      description: Information about a location
      properties:
        address:
          type: string
        address2:
          type: string
          nullable: true
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        city:
          type: string
        state:
          type: string
        stateCode:
          type: string
          nullable: true
        zip:
          type: string
          nullable: true
        country:
          type: string
        countryCode:
          type: string
        timezone:
          type: string
          description: The timezone of the site location.
          example: America/Chicago
    SiteSummary:
      type: object
      properties:
        siteId:
          type: integer
          format: int64
        production:
          $ref: '#/components/schemas/SiteProduction'
        consumption:
          $ref: '#/components/schemas/SiteConsumption'
      example:
        siteId: 49212
        production:
          total: 18.01
          unit: WH
          toSelfConsumption: 9.98
          toStorage: 7.96
          toGrid: 0.07
        consumption:
          total: 20.41
          unit: WH
          fromPv: 9.98
          fromStorage: 10.01
          fromGrid: 0.42
    SiteProduction:
      type: object
      properties:
        total:
          type: number
          format: float
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
            - GWH
        toSelfConsumption:
          type: number
          nullable: true
          format: float
        toStorage:
          type: number
          nullable: true
          format: float
        toGrid:
          type: number
          nullable: true
          format: float
    SiteConsumption:
      type: object
      properties:
        total:
          type: number
          nullable: true
          format: float
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
            - GWH
        fromPv:
          type: number
          nullable: true
          format: float
        fromStorage:
          type: number
          nullable: true
          format: float
        fromGrid:
          type: number
          nullable: true
          format: float
    SitePerformanceResponse:
      type: object
      properties:
        siteId:
          type: integer
          format: int64
        performance:
          $ref: '#/components/schemas/SitePerformance'
      example:
        siteId: 49212
        performance:
          specificYield: 2.93
          performanceRatio: 0.8
    SitePerformance:
      type: object
      properties:
        specificYield:
          type: number
          format: float
        performanceRatio:
          type: number
          nullable: true
          format: float
    Measurements:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        unit:
          type: string
          enum:
            - W
            - KW
            - MW
            - WH
            - KWH
            - MWH
            - PERCENTAGE
            - PERCENTAGE_100
            - VOLT
            - AMPERE
            - HERTZ
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
            - HOUR
            - DAY
            - WEEK
            - MONTH
            - YEAR
            - TOTAL
        values:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
    Period:
      type: object
      properties:
        from:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        to:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
    Measurement:
      type: object
      properties:
        timestamp:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        value:
          type: number
          nullable: true
          format: float
    InternationalSystemUnit:
      type: string
      enum:
        - METRIC
        - IMPERIAL
      default: METRIC
    EnvironmentalBenefits:
      type: object
      properties:
        co2Emissions:
          type: number
          format: float
        evMiles:
          type: number
          format: float
        unit:
          $ref: '#/components/schemas/InternationalSystemUnit'
    SiteLifetimeEnergy:
      type: object
      description: 'The site''s lifetime production energy, read from an onboard cumulative energy counter. It uses the production meter''s counter when the site has one (the sum of all production meters when there are several), otherwise the sum of the inverters'' counters.'
      properties:
        energy:
          type: number
          format: float
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
          default: WH
        lastUpdateTime:
          type: string
          format: offset-date-time
          example: '2026-10-06T10:00:22+02:00'
    SiteExternalProductionEnergy:
      type: object
      description: Lifetime production energy split by source.
      properties:
        energyIncludingExternalSources:
          type: number
          description: The site's solar production.
          format: float
        energyExcludingExternalSources:
          type: number
          description: Production not accounted for by an external-production meter. Equal to energyIncludingExternalSources on sites without external-production meters.
          format: float
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
          default: WH
    Alert:
      type: object
      properties:
        alertId:
          type: integer
          format: int64
        siteId:
          type: integer
          format: int64
        category:
          type: string
        type:
          type: string
        impact:
          type: integer
          format: int32
          minimum: 1
          maximum: 9
        status:
          type: string
          enum:
            - OPEN
            - CLOSED
        firstTrigger:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        lastTrigger:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        closeDate:
          type: string
          nullable: true
          description: Only if the alert is closed.
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        muteExpirationDate:
          type: string
          nullable: true
          description: Only if the alert is muted.
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        component:
          type: object
          properties:
            name:
              type: string
            serialNumber:
              type: string
        errorCodes:
          type: array
          items:
            type: string
    DeviceType:
      type: string
      enum:
        - INVERTER
        - BATTERY
        - BATTERY_MODULE
        - OPTIMIZER
        - METER
        - EV_CHARGER
        - BUI
        - GATEWAY
        - SENSOR
    DeviceData:
      type: object
      description: Information about a particular device.
      properties:
        type:
          $ref: '#/components/schemas/DeviceType'
        serialNumber:
          type: string
          nullable: true
          description: 'The physical serial number assigned to this device. `null` for SENSOR devices, which are identified by `id`.'
        manufacturer:
          type: string
          nullable: true
          description: The device manufacturer. `null` for SENSOR devices.
        model:
          type: string
        partNumber:
          type: string
          nullable: true
        powerModel:
          type: string
        createdAt:
          type: string
          nullable: true
          description: When this device has been added to the site. `null` for SENSOR devices.
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        firmwareVersion:
          type: string
          nullable: true
        firmware:
          type: string
          nullable: true
          description: 'Full firmware version string of the device, for example `4.25.15.1.100.2059.2.100.1751`. `null` when not reported (for example meters and batteries).'
          example: 4.25.15.1.100.2059.2.100.1751
        connectedTo:
          type: string
          nullable: true
          description: 'The serial number of the component this device is connected to (usually an inverter, or a gateway for some device types). `null` for top-level devices.'
        connectedToName:
          type: string
          description: 'The display name of the component this device is connected to. Returned for every device that has a parent, and omitted for top-level devices (where `parent` is `null`). Kept as a compatibility alias for `parent.name`, so existing integrations keep working.'
        parent:
          $ref: '#/components/schemas/DeviceParent'
        active:
          type: boolean
          description: Is the device active or not.
        nameplate:
          type: number
          nullable: true
          description: Device output or capacity. Only valid for BATTERY and INVERTER
          format: float
        name:
          type: string
          description: The display name of the device.
        meterType:
          type: string
          description: 'The type of measurement this meter performs: `Production` (SolarEdge production meter), `ExternalProduction` (meter on non-SolarEdge PV, shown as External Production in the Monitoring platform), `Consumption`, `FeedIn`, `Purchased` or `SelfConsumption`. Only present for METER devices.'
          example: FeedIn
        form:
          type: string
          nullable: true
          description: Whether the meter is a physical device or a virtual (calculated) meter. Only present for METER devices.
          example: physical
        communicationType:
          type: string
          nullable: true
          enum:
            - WIFI
            - ZIGBEE
            - ETHERNET
            - CDMA
            - GSM
            - LTE
            - RS485
            - RS232
            - UNKNOWN
            - null
          description: The communication type of the device - inherits the connected inverter's communication type.
        connectedOptimizers:
          type: integer
          nullable: true
          description: Number of power optimizers connected to this inverter.
          format: int32
        id:
          type: string
          description: 'Sensor id, also the key in `/sites/{id}/sensors/telemetry`. Only present for SENSOR devices.'
        sensorType:
          $ref: '#/components/schemas/SensorType'
        measurement:
          $ref: '#/components/schemas/SensorMeasurement'
    DeviceParent:
      type: object
      nullable: true
      description: 'The device this device is connected to. Use `serialNumber` as the stable key to rebuild the site topology. null for top-level devices (for example a GATEWAY, or a standalone or leader INVERTER).'
      properties:
        serialNumber:
          type: string
          description: The serial number of the parent device.
        type:
          $ref: '#/components/schemas/DeviceType'
        name:
          type: string
          description: The display name of the parent device.
    SensorType:
      type: string
      enum:
        - IRRADIANCE
        - TEMPERATURE
        - WIND
      description: Kind of environmental sensor. Only present for SENSOR devices.
    SensorMeasurement:
      type: string
      enum:
        - PLANE_OF_ARRAY
        - GLOBAL_HORIZONTAL
        - DIRECT
        - DIFFUSED
        - MODULE
        - AMBIENT
        - WIND_SPEED
        - WIND_DIRECTION
      description: What the sensor measures. Only present for SENSOR devices.
    Datetime:
      type: string
      description: 'ISO 8601 date-time with a time zone, for example `2026-10-08T00:00:00Z`. A value without a time zone is rejected with `400 Bad Request`. Returned timestamps are in the site''s local time and carry its UTC offset.'
      format: date-time
      example: '2026-10-01T00:00:00Z'
    InverterTelemetryResponse:
      type: object
      properties:
        inverters:
          type: object
          description: Map of inverter serial number to telemetry data.
          additionalProperties:
            $ref: '#/components/schemas/InverterTelemetryData'
    InverterTelemetryData:
      type: object
      description: Telemetry metrics for a single inverter. Properties are present only if the requested resolution supports them.
      properties:
        power:
          $ref: '#/components/schemas/Measurements'
        energy:
          $ref: '#/components/schemas/Measurements'
        consumedAcPower:
          $ref: '#/components/schemas/Measurements'
        consumedAcEnergy:
          $ref: '#/components/schemas/Measurements'
        voltage:
          $ref: '#/components/schemas/Measurements'
        current:
          $ref: '#/components/schemas/Measurements'
        frequency:
          $ref: '#/components/schemas/Measurements'
    MeterTelemetryResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
            - HOUR
            - DAY
            - WEEK
            - MONTH
            - YEAR
            - TOTAL
        meters:
          type: object
          description: Map of meter serial number to telemetry data.
          additionalProperties:
            $ref: '#/components/schemas/MeterTelemetryData'
    MeterTelemetryData:
      type: object
      description: Telemetry metrics for a single meter. Properties are present only if the requested resolution supports them.
      properties:
        productionEnergy:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        productionPower:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        consumptionEnergy:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        consumptionPower:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        importEnergy:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        importPower:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        exportEnergy:
          $ref: '#/components/schemas/MeterMetricMeasurements'
        exportPower:
          $ref: '#/components/schemas/MeterMetricMeasurements'
    MeterMetricMeasurements:
      type: object
      properties:
        unit:
          type: string
          enum:
            - W
            - KW
            - MW
            - WH
            - KWH
            - MWH
        values:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
    StorageTelemetryResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
            - HOUR
            - DAY
            - WEEK
            - MONTH
            - YEAR
            - TOTAL
        storage:
          type: object
          description: Map of storage serial number to telemetry data.
          additionalProperties:
            $ref: '#/components/schemas/StorageTelemetryData'
    StorageTelemetryData:
      type: object
      description: Telemetry metrics for a single storage device. Properties are present only if the requested resolution supports them.
      properties:
        chargePower:
          $ref: '#/components/schemas/StorageMetricMeasurements'
        dischargePower:
          $ref: '#/components/schemas/StorageMetricMeasurements'
        chargeEnergy:
          $ref: '#/components/schemas/StorageMetricMeasurements'
        dischargeEnergy:
          $ref: '#/components/schemas/StorageMetricMeasurements'
        remainingEnergy:
          $ref: '#/components/schemas/StorageMetricMeasurements'
        stateOfEnergy:
          $ref: '#/components/schemas/StorageMetricMeasurements'
        acGridChargingEnergy:
          description: 'Energy charged into the battery from the AC grid (Wh). Returned at `QUARTER_HOUR` resolution only; not returned at `HOUR`, `DAY`, `WEEK`, `MONTH`, `YEAR` or `TOTAL`.'
          allOf:
            - $ref: '#/components/schemas/StorageMetricMeasurements'
    StorageMetricMeasurements:
      type: object
      properties:
        unit:
          type: string
          enum:
            - W
            - KW
            - MW
            - WH
            - KWH
            - MWH
            - PERCENTAGE
        values:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
    EvChargerTelemetryResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
            - HOUR
            - DAY
            - WEEK
            - MONTH
            - YEAR
            - TOTAL
        evChargers:
          type: object
          description: Map of EV charger serial number to telemetry data.
          additionalProperties:
            $ref: '#/components/schemas/EvChargerTelemetryData'
    EvChargerTelemetryData:
      type: object
      description: Telemetry metrics for a single EV charger. Properties are present only if the requested resolution supports them.
      properties:
        chargingPower:
          $ref: '#/components/schemas/EvChargerMetricMeasurements'
        chargingEnergy:
          $ref: '#/components/schemas/EvChargerMetricMeasurements'
    EvChargerMetricMeasurements:
      type: object
      properties:
        unit:
          type: string
          enum:
            - W
            - WH
        values:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
    SensorTelemetryResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
            - HOUR
            - DAY
            - WEEK
            - MONTH
        sensors:
          type: object
          description: Map of sensor id to its telemetry.
          additionalProperties:
            $ref: '#/components/schemas/SensorTelemetryData'
    SensorTelemetryData:
      type: object
      description: Telemetry for a single environmental sensor.
      properties:
        sensorType:
          $ref: '#/components/schemas/SensorType'
        measurement:
          $ref: '#/components/schemas/SensorMeasurement'
        connectedTo:
          type: string
          description: Serial number of the gateway or Edge Hub the sensor is connected to.
        unit:
          type: string
          enum:
            - W_PER_M2
            - CELSIUS
            - M_PER_S
            - DEGREES
        values:
          type: array
          items:
            $ref: '#/components/schemas/Measurement'
    InverterStatusResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
            - HOUR
        inverters:
          type: object
          description: Map of inverter serial number to status data.
          additionalProperties:
            $ref: '#/components/schemas/InverterStatusData'
    InverterStatusData:
      type: object
      description: Status metrics for a single inverter.
      properties:
        powerLimit:
          type: object
          description: 'Active power limit set on the inverter, as a percentage (0-100) of rated power.'
          properties:
            unit:
              type: string
              enum:
                - PERCENTAGE
            values:
              type: array
              items:
                $ref: '#/components/schemas/InverterStatusMeasurement'
        operationMode:
          type: object
          description: 'Raw inverter operation mode code, as reported by the device. A code, not a quantity, so no `unit`.'
          properties:
            values:
              type: array
              items:
                $ref: '#/components/schemas/InverterStatusMeasurement'
        inverterMode:
          type: object
          description: Decoded inverter operating state. The only status metric whose value is a string.
          properties:
            values:
              type: array
              items:
                $ref: '#/components/schemas/InverterModeMeasurement'
        temperature:
          type: object
          description: Inverter internal temperature.
          properties:
            unit:
              type: string
              enum:
                - CELSIUS
            values:
              type: array
              items:
                $ref: '#/components/schemas/InverterStatusMeasurement'
    InverterStatusMeasurement:
      type: object
      description: 'A status sample: the last known value in its bucket. On the specific-inverter endpoint every bucket is returned, so `value` is `null` for buckets with no reported sample.'
      properties:
        timestamp:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        value:
          type: number
          nullable: true
          format: float
    InverterModeMeasurement:
      type: object
      properties:
        timestamp:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        value:
          type: string
          nullable: true
          enum:
            - 'OFF'
            - SLEEPING
            - STARTING
            - MPPT
            - THROTTLED
            - SHUTTING_DOWN
            - FAULT
            - STANDBY
            - LOCKED_STANDBY
            - LOCKED_FIRE_FIGHTERS
            - LOCKED
            - LOCKED_COMM_TIMEOUT
            - LOCKED_INV_TRIP
            - LOCKED_INV_ARC_DETECTED
            - LOCKED_INV_BACKUP_OVER_CONSUMPTION
            - LOCKED_DG
            - LOCKED_PHASE_BALNCER
            - LOCKED_PRE_COMMISSIONING
            - LOCKED_INTERNAL
            - null
    StorageStatusResponse:
      type: object
      description: 'When the requested batteries have no status data in the window, `storage` is an empty object and `period` and `resolution` can be `null`. An unknown serial number also returns `200` with an empty `storage`.'
      properties:
        period:
          type: object
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Period'
        resolution:
          type: string
          nullable: true
          enum:
            - QUARTER_HOUR
            - null
        storage:
          type: object
          description: Map of storage serial number to status data.
          additionalProperties:
            $ref: '#/components/schemas/StorageStatusData'
    StorageStatusData:
      type: object
      description: Status metrics for a single storage device. A metric is present only where the battery has reported it.
      properties:
        batteryState:
          type: object
          description: 'Raw battery state code, as reported by the device. No public mapping of code to a named state exists yet. A code, not a quantity, so no `unit`.'
          properties:
            values:
              type: array
              items:
                $ref: '#/components/schemas/StorageStatusMeasurement'
        internalTemperature:
          type: object
          description: Battery's internal temperature.
          properties:
            unit:
              type: string
              enum:
                - CELSIUS
            values:
              type: array
              items:
                $ref: '#/components/schemas/StorageStatusMeasurement'
    StorageStatusMeasurement:
      type: object
      description: 'A status sample: the last known value in its bucket.'
      properties:
        timestamp:
          type: string
          format: offset-date-time
          example: '2026-10-01T13:30:00+03:00'
        value:
          type: number
          format: float
    InverterLifetimeEnergyResponse:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/Period'
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
          default: WH
        resolution:
          type: string
          enum:
            - QUARTER_HOUR
          default: QUARTER_HOUR
        lifetimeEnergy:
          type: array
          description: The onboard counter's value sampled every 15 minutes across the requested period.
          items:
            $ref: '#/components/schemas/Measurement'
    SiteInverterLifetimeEnergyResponse:
      type: object
      properties:
        inverters:
          type: array
          description: Every active inverter on the site. Empty if the site has no active inverters.
          items:
            $ref: '#/components/schemas/InverterLifetimeEnergyData'
    InverterLifetimeEnergyData:
      type: object
      description: Lifetime energy counter for a single inverter.
      properties:
        serialNumber:
          type: string
        lifetimeEnergy:
          type: array
          description: The onboard counter's value sampled every 15 minutes across the requested period. Empty if the inverter reported nothing in the period.
          items:
            $ref: '#/components/schemas/Measurement'
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
          default: WH
    MeterLifetimeEnergyResponse:
      type: object
      properties:
        meters:
          type: array
          items:
            $ref: '#/components/schemas/MeterLifetimeEnergyData'
    MeterLifetimeEnergyData:
      type: object
      description: 'Lifetime energy counters for a single meter, one list per direction. Directions the meter does not measure are empty lists.'
      properties:
        serialNumber:
          type: string
        productionEnergy:
          type: array
          description: 'The onboard counter''s value sampled every 15 minutes across the requested period. Empty if this meter does not measure production, or reported nothing in the period.'
          items:
            $ref: '#/components/schemas/Measurement'
        consumptionEnergy:
          type: array
          description: 'The onboard counter''s value sampled every 15 minutes across the requested period. Empty if this meter does not measure consumption, or reported nothing in the period.'
          items:
            $ref: '#/components/schemas/Measurement'
        importEnergy:
          type: array
          description: 'The onboard counter''s value sampled every 15 minutes across the requested period. Empty if this meter does not measure energy purchased from the grid, or reported nothing in the period.'
          items:
            $ref: '#/components/schemas/Measurement'
        exportEnergy:
          type: array
          description: 'The onboard counter''s value sampled every 15 minutes across the requested period. Empty if this meter does not measure energy fed back into the grid, or reported nothing in the period.'
          items:
            $ref: '#/components/schemas/Measurement'
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
          default: WH
    StorageLifetimeEnergyResponse:
      type: object
      properties:
        batteries:
          type: array
          items:
            $ref: '#/components/schemas/StorageLifetimeEnergyData'
    StorageLifetimeEnergyData:
      type: object
      description: Lifetime charge and discharge counters for a single battery.
      properties:
        serialNumber:
          type: string
        lifetimeEnergyCharged:
          type: array
          description: The onboard counter's value sampled every 15 minutes across the requested period.
          items:
            $ref: '#/components/schemas/Measurement'
        lifetimeEnergyDischarged:
          type: array
          description: The onboard counter's value sampled every 15 minutes across the requested period.
          items:
            $ref: '#/components/schemas/Measurement'
        unit:
          type: string
          enum:
            - WH
            - KWH
            - MWH
          default: WH
security:
  - X-API-Key: []
  - OAuth: []

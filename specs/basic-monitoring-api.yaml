              description: Seconds until the caller may retry. Present when the limit has been exceeded. For an exhausted monthly limit this can be weeks.
      security:
        - X-API-Key: []
        - OAuth: []
      servers:
        - url: 'https://monitoringapi.solaredge.com/v2'
          description: Production
      x-credit-cost: 1
  '/sites/{id}/energy':
    get:
      tags:
        - Sites
      summary: Site Energy
      description: |-
        Returns the site's calculated PV production energy time series at the requested resolution.

        Common usage:
        - `resolution=DAY` for daily totals,
        - `resolution=MONTH` for monthly totals,
        - `resolution=YEAR` for annual totals.

        **Computation**

        Each bucketed value is derived from raw device telemetry, which arrives at approximately 5-minute intervals with non-aligned timestamps. Energy delta samples are proportionally time-shifted across bucket boundaries so that each raw sample contributes only the fraction of its interval that falls within the requested bucket window.

        The calculation is based on inverter energy measurements. On sites that include battery storage, battery discharge energy is subtracted from and charge energy is added to the inverter output to produce the net site PV production figure.

        The timestamp of each returned value marks the **start** of the aggregation window.

        **Historical data window limits per `resolution`:**
        * For `QUARTER_HOUR`, you can query up to **12 hours** of data.
        * For `HOUR`, you can query up to **24 hours** of data.
        * `QUARTER_HOUR` and `HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at these resolutions are rejected. `DAY` and coarser resolutions return the full history.
        * For `DAY`, you can query up to **1 month** of data.
        * For `WEEK`, you can query up to 1 year of data.
        * For `MONTH`, you can query up to 3 years of data.
        * For `YEAR`, you can query for an unlimited range of dates.
        * `TOTAL` returns a single value - the total energy between `from` and `to`. To get an all-time lifetime total, set `from` to the site installation date (or an early date such as `2000-01-01`) and `to` to now.

        Requests that exceed the limit for the chosen resolution are rejected with `400 Bad Request`.
      operationId: getSiteEnergy
      parameters:
        - name: from
          in: query
          description: 'If unspecified, will return measurements from midnight today (local site time).'
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'
        - name: to
          in: query
          description: 'If unspecified, will return data until now (local site time)'
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'
        - name: resolution
          in: query
          description: Desired resolution of the returned energy samples. Defaults to QUARTER_HOUR
          schema:
            type: string
            enum:
              - QUARTER_HOUR
              - HOUR
              - DAY
              - WEEK
              - MONTH
              - YEAR
              - TOTAL
            default: QUARTER_HOUR
        - name: unit
          in: query
          schema:
            type: string
            enum:
              - WH
              - KWH
              - MWH
            default: WH
        - name: id
          in: path
          description: The Monitoring Site ID.

  '/sites/{id}/inverters/{serialNumbers}/status':
    get:
      tags:
        - Inverter Status
      summary: Inverter Status
      description: |-
        Returns device status for specific inverters on a site. Multiple serial numbers can be specified as a comma-separated path parameter.

        Unlike telemetry metrics, these are device states rather than measurements: each sample is the **last known value in its bucket**, not an average or sum.

        Every requested inverter that exists on the site is returned with all four metrics and a value for every bucket in the period, so `value` is `null` for buckets with no reported sample.

        **Fields:**

        * **powerLimit** - active power limit set on the inverter, as a percentage (0-100) of rated power.
        * **operationMode** - raw inverter operation mode code, as reported by the device. A code, not a quantity, so no `unit`.
        * **inverterMode** - decoded inverter operating state (e.g. MPPT, STARTING, FAULT, STANDBY, or a LOCKED_* fault state). The only metric whose `value` is a string.
        * **temperature** - inverter internal temperature (°C).

        **Historical data window limits per `resolution`:**

        * For `QUARTER_HOUR`, you can query up to **12 hours** of data.
        * For `HOUR`, you can query up to **24 hours** of data.
        * `QUARTER_HOUR` and `HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at these resolutions are rejected.

        Requests that exceed the limit for the chosen resolution are rejected with `400 Bad Request`.

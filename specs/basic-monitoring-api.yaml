openapi: 3.0.1
info:
  version: 2.2.0
  title: SolarEdge Basic Monitoring API
  description: |-
    The SolarEdge **Basic Monitoring API** gives solar installers, O&M vendors and certified partners read access to site, device and measurement data across their fleet.

    It covers everything you need to build a monitoring dashboard, run reports or pipe data into a data warehouse:

    - Listing sites and reading their metadata, performance and environmental benefits.
    - Retrieving production and consumption energy/power time series at the site level.
    - Discovering inverters, meters, batteries and other devices at a site.
    - Reading **bulk telemetry** for inverters, meters, batteries and EV chargers (multiple metrics per device per request).
    - Reading environmental sensor telemetry (irradiance, temperature, wind).
    - Reading per-inverter, per-meter and per-battery single-metric measurement series.
    - Reading device status (inverters and batteries) as the last known value per time bucket.
    - Reading lifetime energy counters for the site, inverters, batteries and meters.
    - Retrieving open and historical alerts.

    For destination-level breakdowns, real-time live power flow, Weather Guard or battery backup-reserve management, use the **Advanced Monitoring API**.

    ## Authentication

    This API supports two authentication methods:

    * **API Key** (`X-API-Key` header) - include your User API Key in every request. Obtain your key from the SolarEdge developer portal. All endpoints accept API Key authentication.
    * **OAuth 2.0** (bearer token, authorization code flow) - use an OAuth token to access data on behalf of a system owner. Most endpoints accept OAuth. Two fleet-level endpoints - **Site List** (`GET /sites`) and **Fleet Alerts** (`GET /alerts`) - require an API Key and do not accept OAuth bearer tokens.

    ## Tier access

    The Basic Monitoring API is **available on all subscription tiers** (Free, Starter, Growth, Pro, Enterprise). Quota limits - monthly credits and CPM - vary by tier. See the `429 Too Many Requests` response on any operation for the rate-limit model.

    ## Credit cost

    Each API call consumes credits from the caller's billing-cycle quota. The cost per call is noted in this specification via the `x-credit-cost` field on each operation (an OpenAPI documentation annotation, not a response header). Currently every operation costs `1` credit.

    ## Data history

    `QUARTER_HOUR` and `HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at `QUARTER_HOUR`, `HOUR` or any finer resolution are rejected on every endpoint, including site-level, status and lifetime-energy endpoints. `DAY` and coarser resolutions (`WEEK`, `MONTH`, `YEAR`, `TOTAL`) return the full history.
  contact:
    name: SolarEdge API Team
    url: 'https://developer.solaredge.com'
servers:
  - url: 'https://monitoringapi.solaredge.com/v2'
    description: Production
paths:
  /sites:
    get:
      tags:
        - Sites
      summary: Site List
      description: |-
        Returns site details for sites included in your account, sub-accounts and any associated accounts that have granted you access to part or all of their fleet.

        Results are paginated. Use the `page` and `sites-in-page` query parameters to walk the full fleet, and the `name`, `group`, `state` and `city` filters to narrow results.

        *This endpoint is only accessible to registered accounts using a SolarEdge API user.*

        **Authentication:** API Key only (`X-API-Key` header). OAuth bearer tokens are not accepted on this endpoint.
      operationId: getSites
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 10000000
            default: 1
        - name: sites-in-page
          in: query
          description: Defines how many sites are returned per page
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 1000
            default: 50
        - name: name
          in: query
          description: Filter by site name (substring)
          schema:
            type: string
        - name: group
          in: query
          description: Filter only for sites included within this group
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          description: Filter only for sites in this state abbreviations e.g. CA will show only alerts for sites in California.
          schema:
            type: string
        - name: city
          in: query
          description: Filter only for sites in this city
          schema:
            type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteListResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized - missing or invalid API key or OAuth token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: 'Forbidden - the API key does not have permission for the requested site, or the subscription tier does not permit this operation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: |-
            Too Many Requests - the client has exceeded its rate limit.

            Rate limits are enforced per developer account on two axes:
            - **Monthly credit quota** - total credits available per billing cycle.
            - **CPM (calls per minute)** - short-window throughput limit.

            Both limits depend on the subscription **tier** (Free, Starter, Growth, Pro, Enterprise).

            Each API call consumes a number of credits as documented per operation (currently `1` for every operation). When the credit budget is exhausted or CPM is exceeded, subsequent calls return `429` until the limit resets (monthly credits reset on the account's billing-cycle anniversary date; CPM resets within the minute).

            Contact your account manager to confirm your tier's exact limits or to request a quota increase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
          headers:
            x-ratelimit-limit-minute:
              schema:
                type: integer
              description: Maximum number of calls allowed per minute for the caller's tier.
            x-ratelimit-remaining-minute:
              schema:
                type: integer
              description: Number of calls remaining in the current one-minute window.
            x-ratelimit-limit-month:
              schema:
                type: integer
              description: Monthly call limit for the key. Sent instead of the per-minute headers for keys with a monthly limit.
            x-ratelimit-remaining-month:
              schema:
                type: integer
              description: Calls left this month. `0` means the key is blocked until the monthly reset.
            x-ratelimit-limit-second:
              schema:
                type: integer
              description: 'Per-second call limit for the key, sent with the monthly headers.'
            x-ratelimit-remaining-second:
              schema:
                type: integer
              description: Calls left in the current second.
            retry-after:
              schema:
                type: integer
              description: Seconds until the caller may retry. Present when the limit has been exceeded. For an exhausted monthly limit this can be weeks.
      security:
        - X-API-Key: []
      servers:
        - url: 'https://monitoringapi.solaredge.com/v2'
          description: Production
      x-credit-cost: 1

  '/sites/{id}/inverters/lifetime-energy':
    get:
      tags:
        - Inverter Measurements
      summary: Site Inverter Lifetime Energy
      description: |-
        Returns the lifetime production energy for every active inverter on a site, read from each inverter's onboard cumulative energy counter rather than summed from interval telemetry, sampled every 15 minutes (`resolution=QUARTER_HOUR`) across the requested period. Each returned value is the counter's actual reading at that timestamp, not a delta, so unlike `/energy` at `resolution=TOTAL` these values are not affected by gaps in reporting history.

        An inverter that reported nothing in the period is still listed, with an empty `lifetimeEnergy`. Replaced inverters are not listed: their history is returned under the serial of the inverter that replaced them, and the counter starts again from near zero at the replacement. For a site total across replacements, compare Site Lifetime Energy with `/energy` at `resolution=TOTAL` from the installation date and use the higher value. A site with no active inverters returns an empty `inverters` list.

        **Which value you get for each quarter hour:** each value is the first counter reading received within that 15-minute window. Devices send telemetry every 5 minutes, at a fixed offset for each device but at an arbitrary point in time, so the first reading of a window always arrives in the first 5 minutes of that window. For example, for the 00:15 to 00:30 window the value is the reading received between 00:15 and 00:20, and for the 00:30 to 00:45 window it is the reading received between 00:30 and 00:35.

        `from` must be before `to`, and the requested window must not exceed 12 hours. `QUARTER_HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at this resolution are rejected.

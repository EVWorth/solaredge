      summary: Site Meter Lifetime Energy
      description: |-
        Returns the lifetime energy for every active meter on a site, read from each meter's onboard cumulative energy counter rather than summed from interval telemetry, sampled every 15 minutes (`resolution=QUARTER_HOUR`) across the requested period. Each returned value is the counter's actual reading at that timestamp, not a delta, so unlike `/production-energy`, `/consumption-energy`, `/import-energy` and `/export-energy` at `resolution=TOTAL` these values are not affected by gaps in reporting history.


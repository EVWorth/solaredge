  '/sites/{id}/power':
    get:
      tags:
        - Sites
      summary: Site Power
      description: |-
        Returns the site's calculated PV production power time series at the requested resolution.

        Use `resolution` to choose the aggregation bucket size. Supported resolutions: `QUARTER_HOUR` and `HOUR` only. The maximum span between `from` and `to` depends on the chosen resolution.

        **Computation**

        Each bucketed value is derived from raw device telemetry, which arrives at approximately 5-minute intervals with non-aligned timestamps. Values are proportionally time-shifted across bucket boundaries so that each raw sample contributes only the fraction of its interval that falls within the requested bucket window.

        The calculation is based on inverter output measurements. On sites that include battery storage, battery discharge power is subtracted from and charge power is added to the inverter output to produce the net site PV production figure.

        The timestamp of each returned value marks the **start** of the aggregation window.

        **Historical data window limits per `resolution`:**
        * For `QUARTER_HOUR`, you can query up to **12 hours** of data.
        * For `HOUR`, you can query up to **24 hours** of data.
        * `QUARTER_HOUR` and `HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at these resolutions are rejected.

        Requests that exceed the limit for the chosen resolution are rejected with `400 Bad Request`.
      operationId: getSitePower
      parameters:
        - name: from
          in: query
          description: 'If unspecified, will return measurements from midnight today (local site time).'
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'
        - name: to
          in: query
          description: 'If unspecified, will return measurements until now (local site time).'
          schema:
            type: string
            format: date-time
            example: '2026-10-01T00:00:00Z'
        - name: resolution
          in: query
          description: Desired resolution of the returned power samples. Defaults to QUARTER_HOUR
          schema:
            type: string
            enum:
              - QUARTER_HOUR
              - HOUR
            default: QUARTER_HOUR
        - name: unit
          in: query
          schema:
            type: string
            enum:
              - W
              - KW
              - MW
            default: W
        - name: id
          in: path
          description: The Monitoring Site ID.
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Measurements'
              examples:
                Example 1:
                  value:
                    period:
                      from: '2026-10-01T09:00:22+02:00'
                      to: '2026-10-01T10:00:22+02:00'
                    unit: W
                    resolution: QUARTER_HOUR
                    values:
                      - timestamp: '2026-10-01T09:00:00+02:00'
                        value: 167.85
                      - timestamp: '2026-10-01T09:15:00+02:00'
                        value: 290.89
                      - timestamp: '2026-10-01T09:30:00+02:00'
                        value: 491.56
                      - timestamp: '2026-10-01T09:45:00+02:00'
                        value: 798.12
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Unauthorized - missing or invalid API key or OAuth token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
        '403':
          description: 'Forbidden - the API key does not have permission for the requested site, or the subscription tier does not permit this operation.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: The specified SolarEdge Site does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: |-
            Too Many Requests - the client has exceeded its rate limit.

            Rate limits are enforced per developer account on two axes:
            - **Monthly credit quota** - total credits available per billing cycle.
            - **CPM (calls per minute)** - short-window throughput limit.

            Both limits depend on the subscription **tier** (Free, Starter, Growth, Pro, Enterprise).

            Each API call consumes a number of credits as documented per operation (currently `1` for every operation). When the credit budget is exhausted or CPM is exceeded, subsequent calls return `429` until the limit resets (monthly credits reset on the account's billing-cycle anniversary date; CPM resets within the minute).

            Contact your account manager to confirm your tier's exact limits or to request a quota increase.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayError'
          headers:
            x-ratelimit-limit-minute:
              schema:
                type: integer
              description: Maximum number of calls allowed per minute for the caller's tier.
            x-ratelimit-remaining-minute:
              schema:
                type: integer
              description: Number of calls remaining in the current one-minute window.
            x-ratelimit-limit-month:
              schema:
                type: integer
              description: Monthly call limit for the key. Sent instead of the per-minute headers for keys with a monthly limit.
            x-ratelimit-remaining-month:
              schema:
                type: integer
              description: Calls left this month. `0` means the key is blocked until the monthly reset.
            x-ratelimit-limit-second:
              schema:
                type: integer
              description: 'Per-second call limit for the key, sent with the monthly headers.'
            x-ratelimit-remaining-second:
              schema:
                type: integer

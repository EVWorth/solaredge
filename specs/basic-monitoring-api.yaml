  '/sites/{id}/devices':
    get:
      tags:
        - Inventory
      summary: Site Inventory
      description: |-
        Returns the full inventory of devices installed at the site: inverters, meters, batteries, power optimizers, gateways and environmental sensors.

        Use this to discover serial numbers that can be passed to the bulk telemetry endpoints or the per-device measurement endpoints. Use `types=EV_CHARGER` to list EV chargers for `/sites/{id}/ev-chargers/telemetry`.

        Environmental sensors (`types=SENSOR`) have no serial number: each one is identified by `id`, the same key used in `/sites/{id}/sensors/telemetry`, and `serialNumber`, `manufacturer` and `createdAt` are `null`. `connectedTo` and `parent.serialNumber` give the gateway or Edge Hub the sensor is connected to. `active` is `false` for sensors that were removed or replaced.
      operationId: getSiteInventory
      parameters:
        - name: types
          in: query
          description: 'Device types to return. Defaults to `INVERTER` only, so other devices are left out unless you ask for them. Repeat the parameter for several types, for example `types=INVERTER&types=METER&types=BATTERY`. Use `EV_CHARGER` for EV chargers and `SENSOR` for environmental sensors.'
          schema:

  '/sites/{id}/inverters/{serialNumbers}/telemetry':
    get:
      tags:
        - Inverter Telemetry
      summary: Inverter Telemetry
      description: |-
        Returns telemetry data for specific inverters on a site. Multiple serial numbers can be specified as a comma-separated path parameter.

        **Supported metrics by resolution:**
        * `QUARTER_HOUR` and `HOUR`: power, energy, consumedAcPower, consumedAcEnergy, voltage, current, frequency
        * `DAY`, `WEEK`, `MONTH`, `YEAR`: energy, consumedAcEnergy
        * `TOTAL`: energy, consumedAcEnergy

        **Per-metric semantics:**
        * **power** - average of raw samples; timestamp marks the **start** of the window; AC output power (W).
        * **energy** - sum of raw samples; timestamp marks the **start** of the window; AC energy produced (Wh).
        * **consumedAcPower** - average of raw samples; timestamp marks the **start** of the window; AC input power (W).
        * **consumedAcEnergy** - sum of raw samples; timestamp marks the **start** of the window; AC input energy (Wh).
        * **voltage** - average across active phases; timestamp marks the **end** of the window; L1 only (single-phase) or L1+L2+L3 average (3-phase).
        * **current** - derived value (power ÷ voltage); not directly measured; timestamp marks the **start** of the window.
        * **frequency** - average across active phases; timestamp marks the **end** of the window; L1 only (single-phase) or L1+L2+L3 average (3-phase).

        **Historical data window limits per `resolution`:**
        * For `QUARTER_HOUR`, you can query up to **12 hours** of data.
        * For `HOUR`, you can query up to **24 hours** of data.
        * `QUARTER_HOUR` and `HOUR` data is available for the last **1 year**. From December 1, 2026, requests for older data at these resolutions are rejected. `DAY` and coarser resolutions return the full history.
        * For `DAY`, you can query up to **1 month** of data.
        * For `WEEK`, you can query up to 1 year of data.
        * For `MONTH`, you can query up to 3 years of data.
        * For `YEAR`, you can query for an unlimited range of dates.
        * `TOTAL` returns a single value - the total energy between `from` and `to`. To get an all-time lifetime total, set `from` to the site installation date (or an early date such as `2000-01-01`) and `to` to now.

        Requests that exceed the limit for the chosen resolution are rejected with `400 Bad Request`.
      operationId: getInverterTelemetry
      parameters:
        - name: from
          in: query
          description: 'If unspecified, will return measurements from midnight today (local site time).'
          schema:
            $ref: '#/components/schemas/Datetime'
        - name: to
          in: query
          description: 'If unspecified, will return measurements until now (local site time).'
          schema:
            $ref: '#/components/schemas/Datetime'
        - name: resolution
          in: query
          description: Desired resolution of the returned telemetry samples. Defaults to QUARTER_HOUR.
          schema:
            type: string
            enum:
              - QUARTER_HOUR
              - HOUR
              - DAY
              - WEEK
              - MONTH
              - YEAR
              - TOTAL
            default: QUARTER_HOUR
        - name: id
          in: path
          description: The Monitoring Site ID.
          required: true
          schema:
            type: integer
            format: int64
        - name: serialNumbers
          in: path
          description: Comma-separated list of inverter serial numbers.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InverterTelemetryResponse'
              examples:
                Example 1:
                  value:
                    inverters:
                      7E1234B5-67:
                        power:
                          period:
                            from: '2026-01-01T00:00:00Z'
                            to: '2026-01-01T00:30:00Z'
                          unit: W
                          resolution: QUARTER_HOUR
                          values:
                            - timestamp: '2026-01-01T00:00:00Z'
                              value: 4250.3
                            - timestamp: '2026-01-01T00:15:00Z'
                              value: 4310.7
                        energy:

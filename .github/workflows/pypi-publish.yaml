name: Release

# Every push to main is validated, then released if it carries anything to
# release. Nobody tags or publishes by hand:
#
# 1. If the version in pyproject.toml is already tagged, commitizen looks at
#    the conventional commits since that tag and bumps if any warrant it
#    (fix -> patch, feat -> minor, BREAKING CHANGE -> major). It commits the
#    new version and CHANGELOG to main. If nothing warrants a bump, the run
#    stops here.
#    If the version is not tagged yet (a bump merged by hand), it is released
#    as is.
# 2. A GitHub release and tag are created from that version's CHANGELOG
#    section.
# 3. The tagged commit is built, then published to PyPI by a separate job.
#
# Pushes made with GITHUB_TOKEN never trigger workflows, so the bump commit
# does not start another run.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yaml

  release:
    name: Bump, tag and create the GitHub release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the bump commit, create the tag and release
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
    steps:
      # No credentials are left in .git/config: the write token is only handed
      # to the final step, which runs nothing but git and gh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # commitizen reads the history since the last tag
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # Only the dev tools (commitizen); the project itself is not built here.
      - name: Install commitizen
        run: uv sync --only-group dev --no-install-project

      - name: Bump if needed
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          version=$(uv version --short)
          push=false
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            # Already released; bump only if new commits call for it.
            # Exit codes 3 and 21 mean "nothing to bump", which is not an error.
            uv run --no-sync cz --no-raise 3,21 bump --yes
            bumped=$(uv version --short)
            if [ "$bumped" = "$version" ]; then
              echo "Nothing to release since $version."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$bumped
            push=true
          else
            echo "$version is not tagged yet; releasing it as is."
          fi

          # Release notes are this version's section of CHANGELOG.md.
          awk -v v="$version" '$0 ~ "^## " v " " {found=1; next} found && /^## / {exit} found' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

          {
            echo "released=true"
            echo "version=$version"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"

      - name: Push the bump and create the release
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
          PUSH: ${{ steps.bump.outputs.push }}
        run: |
          if [ "$PUSH" = "true" ]; then
            # Hooks are disabled so nothing written into .git by earlier steps
            # can run while the token is in reach.
            git -c core.hooksPath=/dev/null push \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
          if [ -s "$RUNNER_TEMP/notes.md" ]; then
            notes=(--notes-file "$RUNNER_TEMP/notes.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" --title "$VERSION" "${notes[@]}"

  # Build and publish are separate jobs, as PyPA recommends: the build runs
  # third-party code (the build backend) and never holds the PyPI OIDC token;
  # the publish job only uploads the already-built files.
  build:
    name: Build the release
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Check the tag matches the package version
        env:
          TAG: ${{ needs.release.outputs.version }}
        run: |
          VERSION=$(uv version --short)
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$VERSION'."
            exit 1
          fi
          echo "Building $VERSION"

      - name: Build the package
        run: uv build

      - name: Store the distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi-publish:
    name: Upload release to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/solaredge
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

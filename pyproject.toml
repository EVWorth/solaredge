[build-system]
requires = ["uv_build"]
build-backend = "uv_build"


[project]
authors = [{ name = "evworth", email = "elliotworth@protonmail.com"}]
license = {text = "MIT"}
name = "solaredge"
version = "3.1.0"
description = "Sync and async Python client for the SolarEdge Monitoring API (V2)"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["solaredge", "solar", "monitoring", "inverter", "api", "httpx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12", 
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/EVWorth/solaredge"
Issues = "https://github.com/EVWorth/solaredge/issues"
Changelog = "https://github.com/EVWorth/solaredge/blob/main/CHANGELOG.md"
"SolarEdge API docs" = "https://api-docs.solaredge.com/"

[dependency-groups]
dev = [
    "commitizen",
    "prek",
]
test = ["pytest", "pytest-asyncio", "pytest-cov"]
validate = ["ruff"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
required-version = ">=0.8.0"
default-groups = ["dev", "validate", "test"]

[tool.ruff]
line-length = 88
show-fixes = true
target-version = "py310"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "auto"

[tool.ruff.lint]
ignore = [
    "D107",    #missing-docstring-in-init
    "PLR2004", #Magic Values
    "D203",    #no-blank-line-before-class
    "D212",    #multi-line-summary-first-line
]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "I",   # isort
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "D",   # pydocstyle
    "PL",  # pylint
    "RUF", # ruff
    "UP",  # pyupgrade
]
[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
length-sort = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
